version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: morgocms_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mysql
    networks:
      - morgocms
    # Nastav oprávnění storage/ po namountování volume
    entrypoint: >
      sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/content
      && chmod -R 775 /var/www/html/storage /var/www/html/content
      && chmod 777 /var/www/html/config
      && apache2-foreground"

  mysql:
    image: mysql:8.0
    container_name: morgocms_mysql
    environment:
      MYSQL_DATABASE: morgocms
      MYSQL_USER: morgocms
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - morgocms

  adminer:
    image: adminer:latest
    container_name: morgocms_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - morgocms

volumes:
  mysql_data:

networks:
  morgocms:
    driver: bridge
