server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Bezpečnost — blokovat přístup k citlivým souborům
    location ~* /\.(env|git|md|json|lock|xml|yml|yaml)$ {
        deny all;
        return 404;
    }

    # Blokovat vendor a ostatní ne-public adresáře
    location ~* ^/(vendor|app|config|database|storage|tests|lang|bin)/ {
        deny all;
        return 404;
    }

    # Gzip komprese
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Statické soubory s cache headers
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP requesty
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Logy
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
